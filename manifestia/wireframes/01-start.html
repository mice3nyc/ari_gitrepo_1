<!-- @dsCard group="Manifestia 와이어프레임" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>01 시작</title>
<style>
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-4Regular.ttf');font-weight:400}
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-7Bold.ttf');font-weight:700}
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-9Black.ttf');font-weight:900}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Paperlogy',-apple-system,sans-serif}
body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px}
.phone{width:390px;height:844px;background:#fff;border:10px solid #111;border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
.status{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;flex:0 0 auto;font-weight:700}
.screen{flex:1 1 auto;padding:18px 22px 26px;display:flex;flex-direction:column;overflow:hidden}
.lang{display:flex;align-self:center;border:2px solid #111;border-radius:20px;overflow:hidden}
.lg{padding:6px 16px;font-size:12px;font-weight:700;border-right:2px solid #111}
.lg:last-child{border-right:none}
.lg.on{background:#111;color:#fff;font-weight:900}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.sub{font-size:16px;color:#555;line-height:1.5}
.muted{color:#999}
.btn{border:3px solid #111;background:#111;color:#fff;font-weight:900;padding:16px;border-radius:10px;text-align:center;font-size:15px}
</style></head>
<body><div class="phone">
<div class="status"><span>12:30</span><span>▦ ▮</span></div>
<div class="screen">
  <div class="lang"><span class="lg">DE</span><span class="lg">EN</span><span class="lg on">KO</span></div>
  <div class="hero">
    <div class="muted" style="font-size:13px;letter-spacing:2px;font-weight:700">STÄDEL × 놀공</div>
    <div style="font-size:46px;font-weight:900;letter-spacing:-1px">MANIFESTIA</div>
    <div style="width:54px;height:4px;background:#111"></div>
    <div class="sub">포스터에서 단어를 모아<br>너의 선언을 만들어라</div>
    <div class="btn" style="margin-top:24px;width:80%">게임 시작</div>
    <div class="muted" style="font-size:12px;margin-top:6px">슈테델 운영: DE·EN · 개발 테스트: KO</div>
  </div>
</div>
</div></body></html>
