<!-- @dsCard group="Manifestia 와이어프레임" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>05 매니페스토 쓰기</title>
<style>
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-4Regular.ttf');font-weight:400}
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-7Bold.ttf');font-weight:700}
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-9Black.ttf');font-weight:900}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Paperlogy',-apple-system,sans-serif}
body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px}
.phone{width:390px;height:844px;background:#fff;border:10px solid #111;border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
.status{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;flex:0 0 auto;font-weight:700}
.screen{flex:1 1 auto;padding:22px;display:flex;flex-direction:column;overflow:hidden}
.title{font-size:23px;font-weight:900;letter-spacing:-.5px}
.muted{color:#999}
.canvas{border:3px solid #111;background:#fff;border-radius:10px;padding:14px;margin-top:14px;min-height:120px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.slot{border:2px dashed #bbb;border-radius:18px;padding:8px 18px;font-size:13px;color:#bbb}
.chip{border:2px solid #111;background:#fff;border-radius:18px;padding:8px 14px;font-size:13px;font-weight:700}
.chip.on{background:#111;color:#fff}
.wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;flex:1;align-content:flex-start;overflow:hidden}
.btn{border:3px solid #111;background:#f4d000;color:#111;font-weight:900;padding:15px;border-radius:10px;text-align:center;font-size:15px;margin-top:12px}
.nav{flex:0 0 auto;height:66px;border-top:3px solid #111;display:flex;background:#fff}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#bbb;gap:4px;border-right:1px dashed #ddd}
.tab:last-child{border-right:none}.tab.on{color:#fff;font-weight:900;background:#111}
.ico{width:20px;height:20px;border:2px solid currentColor;border-radius:4px}
</style></head>
<body><div class="phone">
<div class="status"><span>12:30</span><span>전사 · 35점</span></div>
<div class="screen">
  <div class="title">선언을 조립하세요</div>
  <div class="muted" style="font-size:13px;margin-top:6px">단어를 눌러 문장에 배치 · 제출 시 소모</div>
  <div class="canvas">
    <span class="chip on">예술은</span><span class="chip on">분노</span><span class="chip on">없이</span>
    <span class="slot">＋ 단어</span>
  </div>
  <div class="muted" style="font-size:12px;margin-top:12px">내 단어 가방에서 고르기</div>
  <div class="wrap">
    <span class="chip">슬픔</span><span class="chip">고통</span><span class="chip">하악하악</span>
    <span class="chip">망설임</span><span class="chip">상처</span><span class="chip">조용함</span>
    <span class="chip">이해</span><span class="chip">마음</span><span class="chip">기쁨</span>
  </div>
  <div class="btn">선언 제출하기 · +20점</div>
</div>
<div class="nav">
  <div class="tab"><div class="ico"></div>매칭</div>
  <div class="tab"><div class="ico"></div>주머니</div>
  <div class="tab on"><div class="ico"></div>쓰기</div>
  <div class="tab"><div class="ico"></div>투표</div>
</div>
</div></body></html>
