<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>07 결과</title>
<style>
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-4Regular.ttf');font-weight:400}
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-7Bold.ttf');font-weight:700}
@font-face{font-family:'Paperlogy';src:url('assets/fonts/Paperlogy-9Black.ttf');font-weight:900}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Paperlogy',-apple-system,sans-serif}
body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px}
.phone{width:390px;height:844px;background:#fff;border:10px solid #111;border-radius:42px;overflow:hidden;display:flex;flex-direction:column}
.status{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;flex:0 0 auto;font-weight:700}
.screen{flex:1 1 auto;padding:24px 22px;display:flex;flex-direction:column;overflow:hidden}
.title{font-size:24px;font-weight:900;letter-spacing:-.5px}
.muted{color:#999}
.rank{display:flex;flex-direction:column;gap:9px;margin-top:18px;flex:1}
.r{border:3px solid #111;background:#fff;border-radius:10px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.r.top{background:#f4d000}
.no{font-weight:900;font-size:18px;width:26px}
.tx{font-size:13px;font-weight:700;line-height:1.35;flex:1}
.vt{font-weight:900;font-size:13px;white-space:nowrap}
.btn{border:3px solid #111;background:#111;color:#fff;font-weight:900;padding:14px;border-radius:10px;text-align:center;font-size:15px;margin-top:14px}
</style></head>
<body><div class="phone">
<div class="status"><span>12:30</span><span>▦ ▮</span></div>
<div class="screen">
  <div class="title">선언별 득표 순위</div>
  <div class="muted" style="font-size:13px;margin-top:6px">이번 세션 · 전체 240표</div>
  <div class="rank">
    <div class="r top"><div class="no">1</div><div class="tx">예술가는 개똥밭에 굴러도 보석이 된다</div><div class="vt">64표</div></div>
    <div class="r top"><div class="no">2</div><div class="tx">예술은 나만 생각하는 이기심이다</div><div class="vt">52표</div></div>
    <div class="r top"><div class="no">3</div><div class="tx">하고 싶었지만 참았다</div><div class="vt">48표</div></div>
    <div class="r"><div class="no">4</div><div class="tx">우리는 영혼이 없다</div><div class="vt">31표</div></div>
    <div class="r"><div class="no">5</div><div class="tx">시키는 대로 했다</div><div class="vt">28표</div></div>
    <div class="r"><div class="no">6</div><div class="tx">나도 예술가가 될 수 있을까</div><div class="vt">19표</div></div>
  </div>
  <div class="btn">내 선언 다시 보기</div>
</div>
</div></body></html>
